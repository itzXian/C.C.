provider-base-config: &provider
  type: http
  proxy: DIRECT
  interval: 86400  # s, 86400/60/60/24=1d
  health-check:
    enable: true
    url: https://www.google.com/generate_204
    expected-status: 200/204/302
    timeout: 999   # ms
    interval: 1800 # s

proxy-providers:
  🟥:
    <<: *provider
    url: "https://example.com"
    override:
      additional-prefix: "🟥 "
  🟢:
    <<: *provider
    url: "https://example.com"
    override:
      additional-prefix: "🟢 "
